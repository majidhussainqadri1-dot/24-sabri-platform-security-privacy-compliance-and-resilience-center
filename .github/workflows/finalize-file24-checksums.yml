name: Finalize File 24 Source Checksums

on:
  push:
    branches:
      - codex/file-24-full-code-complete-0.99.0

permissions:
  contents: write

concurrency:
  group: file24-finalize-checksums
  cancel-in-progress: false

jobs:
  finalize-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-full-code-complete-0.99.0
          fetch-depth: 30

      - name: Recalculate tracked source checksums
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/file24-checksums
          while IFS= read -r line; do
            test -n "$line" || continue
            path="${line#*  }"
            if [ -f "$path" ]; then
              sha256sum "$path" >> /tmp/file24-checksums
            fi
          done < CHECKSUMS.sha256
          mv /tmp/file24-checksums CHECKSUMS.sha256
          test "$(wc -l < CHECKSUMS.sha256)" -ge 360
          sha256sum -c CHECKSUMS.sha256

      - name: Commit checksum correction when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHECKSUMS.sha256; then
            echo "Checksums already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHECKSUMS.sha256
          git commit -m "chore(file-24): finalize source checksums for 0.99.0"
          git push origin HEAD:codex/file-24-full-code-complete-0.99.0
