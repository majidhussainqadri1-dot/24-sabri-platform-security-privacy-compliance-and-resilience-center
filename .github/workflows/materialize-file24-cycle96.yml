name: Materialize File 24 Forty-Round Review

on:
  push:
    branches:
      - codex/file-24-forty-round-review-0.28.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: file24-cycle96-materialization
  cancel-in-progress: false

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-forty-round-review-0.28.0
          fetch-depth: 30

      - name: Detect pending reviewed patch
        id: pending
        shell: bash
        run: |
          if [ -f handoff-cycle96/part-000.b64part ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending Cycle 96 reviewed patch remains."
          fi

      - name: Set up PHP 8.3
        if: steps.pending.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify, apply and test reviewed patch
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "38374e63c50004d363af63d42ed5d0571493bd6388407142f4be8e4d1cfed724  handoff-cycle96/part-000.b64part" | sha256sum -c -
          echo "3ea6bd2723d9aeeb5e87e73a589f19f4856ff7d230e0afaa271a8c554c0a086d  handoff-cycle96/part-001.b64part" | sha256sum -c -
          echo "2a3a071a1dc45cb90dd50974b4cb94dc134461943d207ded7a6fc8643d45fae9  handoff-cycle96/part-002.b64part" | sha256sum -c -
          echo "df865e68056d3373a1f0ad528804d34939f56d52c13952dd2068935a99aa02b5  handoff-cycle96/part-003.b64part" | sha256sum -c -
          echo "ca36677a3436f7deab77fb88917f7e120ea60aaed063b393f37538587b6e7458  handoff-cycle96/part-004.b64part" | sha256sum -c -
          echo "abfd14ea7a10527576626c790fe7c6871df2c2fd1553f16fe084ba7f8fab95ce  handoff-cycle96/part-005.b64part" | sha256sum -c -
          echo "e2254c5a61e19a188d36251c394db4f041a8267e0e11f5eb96a3fb30e327f9e8  handoff-cycle96/part-006.b64part" | sha256sum -c -
          echo "ae8e98166fdfec82a12000e00c7d886d4068c74f05c58c1dce2c143dd2430279  handoff-cycle96/part-007.b64part" | sha256sum -c -
          echo "067af6e76074bb77bda4fcf8a211dd62f91ca18c96daf89b6bf01e2cd0d3d1bb  handoff-cycle96/part-008.b64part" | sha256sum -c -
          cat handoff-cycle96/part-*.b64part > /tmp/file24-cycle96.patch.bz2.b64
          echo "a8fc6cb33283645fdbaf3e0ed4baef942087e8b064361fa4bc3cf3b34af3c366  /tmp/file24-cycle96.patch.bz2.b64" | sha256sum -c -
          base64 -d /tmp/file24-cycle96.patch.bz2.b64 > /tmp/file24-cycle96.patch.bz2
          echo "ef80c31226612ed8ec9fa90441b87b21546a91ce2eec34e74909f0e77139b8c2  /tmp/file24-cycle96.patch.bz2" | sha256sum -c -
          bunzip2 -c /tmp/file24-cycle96.patch.bz2 > /tmp/file24-cycle96.patch
          echo "d87518aa8c1b613fe5c8ca349b808b1e23dfaacc924b3498721eb1e940cff1ff  /tmp/file24-cycle96.patch" | sha256sum -c -
          git apply --check /tmp/file24-cycle96.patch
          git apply /tmp/file24-cycle96.patch
          chmod +x tools/build-release.sh
          rm -rf handoff-cycle96
          git diff --check -- plugin tests tools README.md MANIFEST.md SECURITY.md CHECKSUMS.sha256

          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          count=0
          while IFS= read -r -d '' test_file; do
            php "$test_file"
            count=$((count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*.php' ! -name 'bootstrap.php' -print0 | sort -z)
          test "$count" -eq 102
          sha256sum -c CHECKSUMS.sha256

          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "c062ad32cba27dc533f27241d52c2e54234f8aede00775db82840f498c4143c1  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/materialize-file24-cycle96.yml

      - name: Commit clean reviewed source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- plugin tests tools README.md MANIFEST.md SECURITY.md CHECKSUMS.sha256
          git commit -m "fix(file-24): complete forty review and correction rounds 0.28.0"
          git push origin HEAD:codex/file-24-forty-round-review-0.28.0
