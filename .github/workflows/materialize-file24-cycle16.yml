name: Materialize File 24 Cycle 16 Source

on:
  push:
    branches:
      - codex/file-24-final-plan-v3-0.25.7
  pull_request:
    branches:
      - feature/foundation-0.25.0

permissions:
  contents: write

concurrency:
  group: file24-cycle16-materialization
  cancel-in-progress: false

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-final-plan-v3-0.25.7
          fetch-depth: 10

      - name: Detect pending handoff
        id: handoff
        shell: bash
        run: |
          if [ -f handoff/part-000.bz2part ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending File 24 handoff remains."
          fi

      - name: Set up PHP 8.3
        if: steps.handoff.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify and apply reviewed patch
        if: steps.handoff.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b6585438734f154023a4514df229c21799e2b291 HEAD
          cat handoff/part-*.bz2part > /tmp/file24-cycle16.patch.bz2
          echo "20169a4c31330c24ce143c2a530522dc3871448751044bc703479591e240a569  /tmp/file24-cycle16.patch.bz2" | sha256sum -c -
          bunzip2 -c /tmp/file24-cycle16.patch.bz2 > /tmp/file24-cycle16.patch
          echo "f49068a8ffa9239c7e351e4b14727db7f26e3f81546c919563bf03c0b23e4c1e  /tmp/file24-cycle16.patch" | sha256sum -c -
          patch -p1 --batch --forward < /tmp/file24-cycle16.patch
          rm -rf handoff

      - name: Verify materialized source and adversarial suites
        if: steps.handoff.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          php tests/retention.php
          php tests/upgrade.php
          php tests/activation-cycle9.php
          php tests/boot-failure.php
          php tests/findings.php
          php tests/runtime.php
          php tests/privacy.php
          php tests/privacy-policy.php
          php tests/privacy-verification.php
          php tests/privacy-recovery.php
          php tests/admin-assets.php
          php tests/cycle9.php
          php tests/plugin-boot-cycle9.php
          php tests/governance.php
          php tests/cycle12-adversarial.php
          php tests/cycle13-exhaustive.php
          php tests/cycle14-extraordinary.php
          php tests/cycle15-illuminative.php
          php tests/cycle16-closure.php
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums
          test ! -d handoff

      - name: Verify deterministic package
        if: steps.handoff.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "874fdfd0ecd992e94d7bb704c7d4a6053758b4c85b0878599f5f7c99ea08a5c3  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

      - name: Commit clean reviewed source
        if: steps.handoff.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(file-24): complete 0.25.7 Cycle 16 reviewed foundation"
          git push origin HEAD:codex/file-24-final-plan-v3-0.25.7
