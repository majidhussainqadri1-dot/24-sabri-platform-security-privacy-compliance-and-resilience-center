name: Apply Reviewed Corrective Source

on:
  push:
    branches: [feature/foundation-0.25.0]
    paths:
      - tools/corrective-source.ready

permissions:
  contents: write

jobs:
  apply-reviewed-source:
    if: github.repository_owner == 'majidhussainqadri1-dot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-0.25.0
          fetch-depth: 0

      - name: Decode and validate reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat tools/corrective-source.part-* > /tmp/file24-source.tar.gz.b64
          base64 --decode /tmp/file24-source.tar.gz.b64 > /tmp/file24-source.tar.gz
          test "$(sha256sum /tmp/file24-source.tar.gz | awk '{print $1}')" = "2ccae50632472906d6d7cfe5f0cf064e6ebf1f6ce6466d317811c1f45ec40c17"
          ! tar -tzf /tmp/file24-source.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'
          tar -xzf /tmp/file24-source.tar.gz -C .
          rm -f tools/corrective-source.tar.gz.b64 tools/corrective-source.part-* tools/corrective-source.ready .github/workflows/apply-corrective-bundle.yml

      - name: Verify corrective source before commit
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          sha256sum -c CHECKSUMS.sha256
          ./tools/build-release.sh

      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden foundation and add risk control incident workflows'
          git push origin HEAD:feature/foundation-0.25.0
