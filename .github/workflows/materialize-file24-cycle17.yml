name: Materialize File 24 Cycle 17 Correction

on:
  push:
    branches:
      - codex/file-24-final-plan-v3-0.25.7
  pull_request:
    branches:
      - feature/foundation-0.25.0

permissions:
  contents: write

concurrency:
  group: file24-cycle17-materialization
  cancel-in-progress: false

jobs:
  apply-review-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-final-plan-v3-0.25.7
          fetch-depth: 10

      - name: Detect pending Cycle 17 correction
        id: pending
        shell: bash
        run: |
          if [ -f cycle17/file24-cycle17.patch.bz2 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending Cycle 17 correction remains."
          fi

      - name: Set up PHP 8.0
        if: steps.pending.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Verify and apply reviewed correction
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "adfe08054e531dc438129793ca7ee685cca070c438a46f70b5959da1b1ec1675  cycle17/file24-cycle17.patch.bz2" | sha256sum -c -
          bunzip2 -c cycle17/file24-cycle17.patch.bz2 > /tmp/file24-cycle17.patch
          echo "6a98dc70d5d8b40de4a22cae496a8c5463859fe89edd3193a6d7885de0750d5f  /tmp/file24-cycle17.patch" | sha256sum -c -
          patch -p1 --batch --forward < /tmp/file24-cycle17.patch
          rm -rf cycle17 .github/workflows/materialize-file24-cycle17.yml
          git diff --check

      - name: Run PHP 8.0 closure and complete suite
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in \
            run retention upgrade activation-cycle9 boot-failure findings runtime \
            privacy privacy-policy privacy-verification privacy-recovery admin-assets \
            cycle9 plugin-boot-cycle9 governance cycle12-adversarial cycle13-exhaustive \
            cycle14-extraordinary cycle15-illuminative cycle16-closure cycle17-illuminative
          do
            php "tests/${test}.php"
          done
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums
          test ! -d cycle17
          test ! -f .github/workflows/materialize-file24-cycle17.yml

      - name: Verify deterministic package identity
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "874fdfd0ecd992e94d7bb704c7d4a6053758b4c85b0878599f5f7c99ea08a5c3  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

      - name: Commit clean Cycle 17 source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(file-24): close PHP 8.0 Cycle 17 compatibility defect"
          git push origin HEAD:codex/file-24-final-plan-v3-0.25.7
