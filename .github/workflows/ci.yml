name: Foundation Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP files
        run: find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run foundation contract tests
        run: |
          php tests/run.php
          php tests/retention.php
          php tests/upgrade.php
          php tests/findings.php
          php tests/runtime.php
          php tests/privacy.php
          php tests/privacy-recovery.php
          php tests/admin-assets.php

      - name: Reject common secret material
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -print -quit | grep -q .
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY' plugin docs tests README.md SECURITY.md
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' plugin docs tests README.md SECURITY.md

      - name: Verify plugin and schema version consistency
        run: |
          grep -q 'Version:     0.25.2' plugin/sabri-security-center/sabri-security-center.php
          grep -q "define('SPCRC_VERSION', '0.25.2')" plugin/sabri-security-center/sabri-security-center.php
          grep -q "public const VERSION = '0.25.2'" plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'Stable tag: 0.25.2' plugin/sabri-security-center/readme.txt

      - name: Reject self-mutating source workflows and staged source bundles
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .github/workflows/apply-cycle2.yml
          test ! -f tools/cycle2-source.ready
          ! find tools -maxdepth 1 -type f -name 'cycle2-bundle.part-*' -print -quit | grep -q .
          if grep -RInE --exclude='ci.yml' 'git push|contents:[[:space:]]*write' .github/workflows; then
            exit 1
          fi

      - name: Report cycle 5 changed source hashes
        run: |
          sha256sum \
            plugin/sabri-security-center/sabri-security-center.php \
            plugin/sabri-security-center/readme.txt \
            plugin/sabri-security-center/src/Admin/PrivacyAdmin.php \
            plugin/sabri-security-center/src/Deactivation.php \
            plugin/sabri-security-center/src/Plugin.php \
            plugin/sabri-security-center/src/Privacy/RecoveryManager.php \
            plugin/sabri-security-center/src/Privacy/RequestDispatcher.php \
            plugin/sabri-security-center/src/Storage/PrivacyRequestRepository.php \
            plugin/sabri-security-center/src/Storage/Schema.php \
            tests/privacy.php \
            tests/privacy-recovery.php \
            tests/run.php

      - name: Verify source checksums except workflow self-hash
        shell: bash
        run: |
          set -euo pipefail
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums

      - name: Build and verify installable package
        id: package
        shell: bash
        run: |
          PACKAGE="$(./tools/build-release.sh)"
          test -f "$PACKAGE"
          unzip -t "$PACKAGE"
          unzip -l "$PACKAGE" | grep -q 'sabri-security-center/sabri-security-center.php'
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed plugin package
        uses: actions/upload-artifact@v4
        with:
          name: file-24-security-center-0.25.2
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error
