name: File 24 Repository Code-Complete Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-code-complete-integrity:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP source and tests
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' source_file; do
            php -l "$source_file"
            count=$((count + 1))
          done < <(find plugin tests -type f -name '*.php' -print0 | sort -z)
          test "$count" -ge 176
          echo "Linted $count PHP files."

      - name: Run the complete historical and code-complete suites
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' test_file; do
            php "$test_file"
            count=$((count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*.php' ! -name 'bootstrap.php' -print0 | sort -z)
          test "$count" -ge 108
          echo "Executed $count independent PHP test programs."

      - name: Reject secrets, private operations material and unsafe PHP
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY' plugin docs tests README.md SECURITY.md
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' plugin docs tests README.md SECURITY.md
          ! grep -RInE --include='*.php' '\b(eval|exec|shell_exec|system|passthru|proc_open|popen|base64_decode)\s*\(' plugin
          ! grep -RInE --include='*.php' ':[[:space:]]*never\b' plugin tests
          ! grep -RInE --include='*.php' '(^|[^A-Za-z0-9_])true[[:space:]]*\|' plugin tests
          ! grep -RIn --include='*.php' 'array_is_list(' plugin tests

      - name: Verify release, schema, SBOM and package metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version:     0.99.0' plugin/sabri-security-center/sabri-security-center.php
          grep -q "define('SPCRC_VERSION', '0.99.0')" plugin/sabri-security-center/sabri-security-center.php
          grep -q "public const VERSION = '0.25.5'" plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'Stable tag: 0.99.0' plugin/sabri-security-center/readme.txt
          grep -q 'License Inventory — 0.99.0' plugin/sabri-security-center/LICENSES.md
          grep -q 'GPL-2.0-or-later' plugin/sabri-security-center/LICENSES.md
          php -r '$d=json_decode(file_get_contents("plugin/sabri-security-center/SBOM.spdx.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["spdxVersion"] ?? "") !== "SPDX-2.3" || ($d["packages"][0]["versionInfo"] ?? "") !== "0.99.0") { exit(1); }'
          php -r '$d=json_decode(file_get_contents("docs/SCHEMA-MANIFEST-0.99.0.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["schema_version"] ?? "") !== "0.25.5" || count($d["logical_registry_types"] ?? []) !== 28) { exit(1); }'
          php -r '$d=json_decode(file_get_contents("docs/SOURCE-MANIFEST-0.99.0.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["runtime_version"] ?? "") !== "0.99.0" || empty($d["public_safe_only"]) || !empty($d["private_operations_material_bundled"])) { exit(1); }'

      - name: Verify F24-R001 through F24-R100 repository coding closure
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "tests/bootstrap.php"; if (Sabri\Platform\Security\Registry\RequirementCatalog::count() !== 100 || !Sabri\Platform\Security\Registry\RequirementCatalog::repositoryCodingComplete()) { exit(1); }'
          php -r 'require "tests/bootstrap.php"; if (count(Sabri\Platform\Security\Registry\PlatformIntegrationMatrix::all()) !== 26) { exit(1); }'
          php -r 'require "tests/bootstrap.php"; if (count(Sabri\Platform\Security\Registry\GovernedArtifactRegistry::types()) !== 28) { exit(1); }'
          php -r 'require "tests/bootstrap.php"; if (count(Sabri\Platform\Security\Policy\BoundaryPolicyCatalog::all()) !== 6) { exit(1); }'
          php -r 'require "tests/bootstrap.php"; if (count(Sabri\Platform\Security\Release\ReleaseGateManager::phases()) !== 12) { exit(1); }'
          php -r 'require "tests/bootstrap.php"; if (count(Sabri\Platform\Security\Capabilities::all()) < 27) { exit(1); }'
          grep -q 'F24-R100' docs/REQUIREMENTS-TRACEABILITY-0.99.0.md
          grep -q 'repository_coding_complete' plugin/sabri-security-center/src/Release/ReleaseStatus.php
          grep -q "PRODUCTION_TARGET = '1.0.0'" plugin/sabri-security-center/src/Release/ReleaseStatus.php

      - name: Verify security, privacy, incident and resilience contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'final class GovernedArtifactRegistry' plugin/sabri-security-center/src/Registry/GovernedArtifactRegistry.php
          grep -q 'final class IdentityAssurance' plugin/sabri-security-center/src/Security/IdentityAssurance.php
          grep -q 'final class EndpointGuard' plugin/sabri-security-center/src/Security/EndpointGuard.php
          grep -q 'spcrc_private_delivery_consume_failed' plugin/sabri-security-center/src/Security/PrivateDeliveryPolicy.php
          grep -q 'dns_get_record' plugin/sabri-security-center/src/Security/NetworkPolicy.php
          grep -q 'spcrc_vulnerability_finding_failed' plugin/sabri-security-center/src/Security/VulnerabilityManager.php
          grep -q 'spcrc_incident_declaration_partial' plugin/sabri-security-center/src/Incident/IncidentCoordinator.php
          grep -q 'spcrc_drill_finding_failed' plugin/sabri-security-center/src/Resilience/ResilienceCoordinator.php
          grep -q 'persistence_failed' plugin/sabri-security-center/src/Monitoring/RemoteEvidenceQueue.php
          grep -q 'spcrc/authorize_privacy_module_callback' plugin/sabri-security-center/src/Privacy/PrivacyRequestPolicy.php
          grep -q 'spcrc/verify_step_up_assurance' plugin/sabri-security-center/src/Privacy/PrivacyRequestPolicy.php
          grep -q 'spcrc_privacy_verification_stale' plugin/sabri-security-center/src/Privacy/PrivacyVerificationStore.php
          grep -q 'REQUIRED_INDEXES' plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'retention_lock_lost_before_evidence' plugin/sabri-security-center/src/Retention/RetentionManager.php
          grep -q 'spcrc_manifest_stored_hash_invalid' plugin/sabri-security-center/src/Registry/ModuleRegistry.php
          grep -q 'MAX_TTL = 86400' plugin/sabri-security-center/src/Support/AtomicOptionLock.php
          grep -q 'spcrc_atomic_lock_invalid' plugin/sabri-security-center/src/Support/AtomicOptionLock.php

      - name: Verify complete public-safe documentation and manuals
        shell: bash
        run: |
          set -euo pipefail
          for doc in \
            CODE-COMPLETE-SUMMARY-0.99.0.md RELEASE-RECEIPT-0.99.0.md KNOWN-LIMITATIONS-0.99.0.md \
            REQUIREMENTS-TRACEABILITY-0.99.0.md LOGICAL-DATA-MODEL-0.99.0.md SCHEMA-MANIFEST-0.99.0.json \
            SECURITY-ARCHITECTURE-0.99.0.md DATA-FLOW-OWNERSHIP-0.99.0.md CONTROL-CATALOG-0.99.0.md \
            THREAT-MODEL-0.99.0.md FILES-00-25-INTEGRATION-MATRIX-0.99.0.md IMPLEMENTATION-PHASES-0.99.0.md \
            MODULE-SECURITY-SDK-0.99.0.md API-EVENT-CONTRACTS-0.99.0.md COMPLIANCE-APPLICABILITY-0.99.0.md \
            INCIDENT-RESPONSE-PLAN-0.99.0.md DISASTER-RECOVERY-PLAN-0.99.0.md BACKUP-RESTORE-GUIDE-0.99.0.md \
            KEY-GOVERNANCE-GUIDE-0.99.0.md MIGRATION-ROLLBACK-0.99.0.md QA-PLAN-0.99.0.md CHANGE-CONTROL-0.99.0.md \
            REVIEW-AND-CORRECTION-0.99.0-ROUND-1.md REVIEW-AND-CORRECTION-0.99.0-ROUND-2.md \
            REVIEW-AND-CORRECTION-0.99.0-ROUND-3.md REVIEW-AND-CORRECTION-0.99.0-ROUND-4.md \
            SOURCE-MANIFEST-0.99.0.json; do
            test -f "docs/$doc"
          done
          for manual in \
            ADMINISTRATOR-MANUAL.md PRIVACY-OFFICER-MANUAL.md INCIDENT-COMMANDER-MANUAL.md BACKUP-OPERATOR-MANUAL.md \
            DEVELOPER-SECURITY-GUIDE.md TRUST-CENTER-GUIDANCE.md SECURITY-ARCHITECTURE.md DATA-FLOW-OWNERSHIP.md \
            CONTROL-CATALOG.md MODULE-SECURITY-SDK.md API-EVENT-CONTRACTS.md COMPLIANCE-APPLICABILITY.md \
            INCIDENT-RESPONSE-PLAN.md DISASTER-RECOVERY-PLAN.md BACKUP-RESTORE-GUIDE.md KEY-GOVERNANCE-GUIDE.md \
            LOGICAL-DATA-MODEL.md THREAT-MODEL.md INTEGRATION-MATRIX.md RETENTION-MATRIX.md MIGRATION-ROLLBACK.md \
            KNOWN-LIMITATIONS.md SCHEMA-MANIFEST.json SOURCE-MANIFEST.json; do
            test -f "plugin/sabri-security-center/docs/$manual"
          done

      - name: Reject staged source bundles and self-mutating workflows
        shell: bash
        run: |
          set -euo pipefail
          ! find . -maxdepth 2 -type d -name 'handoff*' -print -quit | grep -q .
          test ! -d cycle17
          ! find .github/workflows -type f ! -name 'ci.yml' -print -quit | grep -q .
          if grep -RInE --exclude='ci.yml' 'git push|contents:[[:space:]]*write' .github/workflows; then
            exit 1
          fi

      - name: Verify source checksums
        shell: bash
        run: |
          set -euo pipefail
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums

      - name: Build package twice and verify reproducibility
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "75b57bb893ff158739cabbc0b969187a9a82ae147eb8b8c36e7405b2e7ea2d4f  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"
          unzip -l "$PACKAGE_TWO" | grep -q 'sabri-security-center/sabri-security-center.php'
          unzip -l "$PACKAGE_TWO" | grep -q 'sabri-security-center/SBOM.spdx.json'
          unzip -l "$PACKAGE_TWO" | grep -q 'sabri-security-center/docs/ADMINISTRATOR-MANUAL.md'
          (cd "$(dirname "$PACKAGE_TWO")" && sha256sum -c "$(basename "$PACKAGE_TWO").sha256")
          echo "path=$PACKAGE_TWO" >> "$GITHUB_OUTPUT"

      - name: Upload code-complete plugin package
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-24-security-center-0.99.0
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error

      - name: Create sanitized code-complete source snapshot
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file24-source /tmp/file24-source-snapshot-cycle102.zip
          mkdir -p /tmp/file24-source
          rsync -a --exclude='.git' --exclude='build' ./ /tmp/file24-source/
          (cd /tmp && zip -X -q -r file24-source-snapshot-cycle102.zip file24-source)

      - name: Upload sanitized code-complete source snapshot
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-24-sanitized-source-snapshot-cycle102
          path: /tmp/file24-source-snapshot-cycle102.zip
          if-no-files-found: error
