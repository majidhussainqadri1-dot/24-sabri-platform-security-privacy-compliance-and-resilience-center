name: Foundation Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP files
        run: find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run foundation contract tests
        run: php tests/run.php

      - name: Reject common secret material
        shell: bash
        run: |
          test ! -f .env
          ! grep -RInE 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY' plugin docs tests tools README.md SECURITY.md
          ! grep -RInE '(password|secret|token)[[:space:]]*=[[:space:]]*["'\''][^"'\'']{8,}' plugin docs tests tools README.md SECURITY.md

      - name: Verify plugin and schema version consistency
        run: |
          grep -q 'Version:     0.25.1' plugin/sabri-security-center/sabri-security-center.php
          grep -q "define('SPCRC_VERSION', '0.25.1')" plugin/sabri-security-center/sabri-security-center.php
          grep -q "public const VERSION = '0.25.1'" plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'Stable tag: 0.25.1' plugin/sabri-security-center/readme.txt

      - name: Verify source checksums
        run: sha256sum -c CHECKSUMS.sha256

      - name: Build and verify installable package
        id: package
        shell: bash
        run: |
          PACKAGE="$(./tools/build-release.sh)"
          test -f "$PACKAGE"
          unzip -t "$PACKAGE"
          unzip -l "$PACKAGE" | grep -q 'sabri-security-center/sabri-security-center.php'
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed plugin package
        uses: actions/upload-artifact@v4
        with:
          name: file-24-security-center-0.25.1
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error

  apply-cycle2-reviewed-source:
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}"
    needs: foundation-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified second-cycle source when staged
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/cycle2-source.ready || ! -f tools/cycle2-source.tar.gz.b64 ]]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode tools/cycle2-source.tar.gz.b64 > /tmp/file24-cycle2.tar.gz
          test "$(sha256sum /tmp/file24-cycle2.tar.gz | awk '{print $1}')" = "c0a1da547e4aa0902324f049b801cab80388ea0ede17f020aa520cde24dd5632"
          ! tar -tzf /tmp/file24-cycle2.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'
          tar -xzf /tmp/file24-cycle2.tar.gz -C .
          rm -f tools/cycle2-source.tar.gz.b64 tools/cycle2-source.ready
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/apply-cycle2.yml
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          sha256sum -c CHECKSUMS.sha256
          PACKAGE="$(./tools/build-release.sh)"
          unzip -t "$PACKAGE"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Commit reviewed second-cycle source
        if: "${{ steps.apply.outputs.applied == 'true' }}"
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete second review cycle and add lifecycle operations'
          git push origin "HEAD:${HEAD_REF}"
