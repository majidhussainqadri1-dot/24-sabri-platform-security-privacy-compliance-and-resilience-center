name: Foundation Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-integrity:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP source and tests
        run: find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run complete historical and forty-round suites
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' test_file; do
            php "$test_file"
            count=$((count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*.php' ! -name 'bootstrap.php' -print0 | sort -z)
          test "$count" -ge 100
          echo "Executed $count independent PHP test programs."

      - name: Reject common secret material
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name 'id_rsa' \) -print -quit | grep -q .
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY' plugin docs tests README.md SECURITY.md
          ! grep -RInE --exclude='CHECKSUMS.sha256' --exclude='ci.yml' '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' plugin docs tests README.md SECURITY.md

      - name: Verify release, schema and package metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version:     0.28.0' plugin/sabri-security-center/sabri-security-center.php
          grep -q "define('SPCRC_VERSION', '0.28.0')" plugin/sabri-security-center/sabri-security-center.php
          grep -q "public const VERSION = '0.25.5'" plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'Stable tag: 0.28.0' plugin/sabri-security-center/readme.txt
          grep -q 'License Inventory — 0.28.0' plugin/sabri-security-center/LICENSES.md
          php -r '$d=json_decode(file_get_contents("plugin/sabri-security-center/SBOM.spdx.json"), true, 512, JSON_THROW_ON_ERROR); if (($d["spdxVersion"] ?? "") !== "SPDX-2.3" || ($d["packages"][0]["versionInfo"] ?? "") !== "0.28.0") { exit(1); }'
          test -f docs/FORTY-ROUND-REVIEW-SUMMARY-0.28.0.md
          test -f docs/RELEASE-RECEIPT-0.28.0.md
          test -f docs/KNOWN-LIMITATIONS-0.28.0.md
          test -f docs/REQUIREMENTS-TRACEABILITY-0.28.0.md
          for cycle in $(seq 57 96); do
            test -f "docs/REVIEW-AND-CORRECTION-0.28.0-CYCLE-${cycle}.md"
            find tests -maxdepth 1 -type f -name "cycle${cycle}-*.php" -print -quit | grep -q .
          done

      - name: Verify forty-round corrective source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'wordpress_uuid_generation_failed' plugin/sabri-security-center/src/Support/SecureIdentifier.php
          grep -q 'spcrc_atomic_lock_invalid' plugin/sabri-security-center/src/Support/AtomicOptionLock.php
          grep -q 'MAX_TTL = 86400' plugin/sabri-security-center/src/Support/AtomicOptionLock.php
          grep -q 'validUtf8' plugin/sabri-security-center/src/Support/Sanitizer.php
          grep -q 'ALLOWED_RESULTS' plugin/sabri-security-center/src/Storage/AuditLogger.php
          grep -q '_incoming_correlation_hash' plugin/sabri-security-center/src/Storage/AuditLogger.php
          grep -q 'CAPACITY_MARKER_OPTION' plugin/sabri-security-center/src/Storage/AuditGapStore.php
          grep -q 'audit_gap_reconciled' plugin/sabri-security-center/src/Storage/AuditGapStore.php
          grep -q 'spcrc_manifest_version_invalid' plugin/sabri-security-center/src/Registry/ModuleRegistry.php
          grep -q 'spcrc_manifest_stored_hash_invalid' plugin/sabri-security-center/src/Registry/ModuleRegistry.php
          grep -q 'resolve_service_actor' plugin/sabri-security-center/src/Registry/SecurityStateRegistry.php
          grep -q 'security-state-request:' plugin/sabri-security-center/src/Registry/SecurityStateRegistry.php
          grep -q 'security-state-resolution:' plugin/sabri-security-center/src/Registry/SecurityStateRegistry.php
          grep -q 'public static function install(): bool' plugin/sabri-security-center/src/Capabilities.php
          grep -q 'spcrc_activation_installed_at_failed' plugin/sabri-security-center/src/Activation.php
          grep -q 'spcrc_installed_version_invalid' plugin/sabri-security-center/src/UpgradeManager.php
          grep -q 'upgrade_failure_evidence_unavailable' plugin/sabri-security-center/src/UpgradeManager.php
          grep -q 'REQUIRED_INDEXES' plugin/sabri-security-center/src/Storage/Schema.php
          grep -q 'scheduleValid' plugin/sabri-security-center/src/Retention/RetentionManager.php
          grep -q 'retention_lock_lost_before_evidence' plugin/sabri-security-center/src/Retention/RetentionManager.php
          grep -q 'spcrc_privacy_recovery_scan_lock' plugin/sabri-security-center/src/Privacy/RecoveryManager.php
          grep -q 'spcrc_privacy_verification_stale' plugin/sabri-security-center/src/Privacy/PrivacyVerificationStore.php
          ! grep -RInE --include='*.php' ':[[:space:]]*never\b' plugin tests
          ! grep -RInE --include='*.php' '(^|[^A-Za-z0-9_])true[[:space:]]*\|' plugin tests
          ! grep -RIn --include='*.php' 'array_is_list(' plugin tests

      - name: Reject self-mutating workflows and staged source bundles
        shell: bash
        run: |
          set -euo pipefail
          test ! -d handoff
          test ! -d handoff-cycle41
          test ! -d handoff-cycle56
          test ! -d handoff-cycle96
          test ! -d cycle17
          test ! -f .github/workflows/materialize-file24-cycle12.yml
          test ! -f .github/workflows/materialize-file24-cycle17.yml
          test ! -f .github/workflows/materialize-file24-cycle41.yml
          test ! -f .github/workflows/materialize-file24-cycle56.yml
          test ! -f .github/workflows/materialize-file24-cycle96.yml
          test ! -f .github/workflows/apply-cycle2.yml
          ! find .github/workflows -type f ! -name 'ci.yml' -print -quit | grep -q .
          if grep -RInE --exclude='ci.yml' 'git push|contents:[[:space:]]*write' .github/workflows; then
            exit 1
          fi

      - name: Verify source checksums
        shell: bash
        run: |
          set -euo pipefail
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums

      - name: Build package twice and verify reproducibility
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "c062ad32cba27dc533f27241d52c2e54234f8aede00775db82840f498c4143c1  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"
          unzip -l "$PACKAGE_TWO" | grep -q 'sabri-security-center/sabri-security-center.php'
          unzip -l "$PACKAGE_TWO" | grep -q 'sabri-security-center/SBOM.spdx.json'
          (cd "$(dirname "$PACKAGE_TWO")" && sha256sum -c "$(basename "$PACKAGE_TWO").sha256")
          echo "path=$PACKAGE_TWO" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed plugin package
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-24-security-center-0.28.0
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.path }}.sha256
          if-no-files-found: error

      - name: Create sanitized source snapshot
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/file24-source /tmp/file24-source-snapshot-cycle96.zip
          mkdir -p /tmp/file24-source
          rsync -a --exclude='.git' --exclude='build' ./ /tmp/file24-source/
          (cd /tmp && zip -X -q -r file24-source-snapshot-cycle96.zip file24-source)

      - name: Upload sanitized source snapshot
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-24-sanitized-source-snapshot-cycle96
          path: /tmp/file24-source-snapshot-cycle96.zip
          if-no-files-found: error
