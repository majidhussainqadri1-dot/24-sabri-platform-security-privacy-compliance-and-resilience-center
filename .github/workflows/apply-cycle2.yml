name: Apply Reviewed Cycle 2 Source

on:
  push:
    branches: [feature/foundation-0.25.0]
    paths:
      - tools/cycle2-source.tar.gz.b64

permissions:
  contents: write

jobs:
  apply-reviewed-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundation-0.25.0
          fetch-depth: 0

      - name: Validate and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/cycle2-source.tar.gz.b64 > /tmp/file24-cycle2.tar.gz
          test "$(sha256sum /tmp/file24-cycle2.tar.gz | awk '{print $1}')" = "c0a1da547e4aa0902324f049b801cab80388ea0ede17f020aa520cde24dd5632"
          ! tar -tzf /tmp/file24-cycle2.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'
          tar -xzf /tmp/file24-cycle2.tar.gz -C .
          rm -f tools/cycle2-source.tar.gz.b64

      - name: Review gates before commit
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          sha256sum -c CHECKSUMS.sha256
          PACKAGE="$(./tools/build-release.sh)"
          unzip -t "$PACKAGE"

      - name: Commit reviewed source without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/apply-cycle2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete second review cycle and add lifecycle operations'
          git push origin HEAD:feature/foundation-0.25.0
