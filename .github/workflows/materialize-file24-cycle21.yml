name: Materialize File 24 Four-Round Review

on:
  push:
    branches:
      - codex/file-24-four-round-review-0.25.8
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: file24-cycle21-materialization
  cancel-in-progress: false

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-four-round-review-0.25.8
          fetch-depth: 30

      - name: Detect pending reviewed patch
        id: pending
        shell: bash
        run: |
          if [ -f cycle21/part-00.b64part ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending File 24 Cycle 21 materialization remains."
          fi

      - name: Set up PHP 8.3
        if: steps.pending.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Preserve repository CI source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: cp .github/workflows/ci.yml /tmp/file24-remote-ci.yml

      - name: Materialize accepted Cycle 17 baseline
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cycle17/part-00.bz2part ]; then
            echo "955d5dc847dedcb0fea3ca1d643678496773c10f5dc0a4d11ed5a7ef0ca6804d  cycle17/part-00.bz2part" | sha256sum -c -
            echo "cb960479ed5ccc1060c4270a72b2d4440f6e137c8b15a446b6d976c83e2772e2  cycle17/part-01.bz2part" | sha256sum -c -
            echo "13b772d3d60ac62d5dcf2e2102f0cc719ebcc68c11c8f94e3864a7abdcae8ebd  cycle17/part-02.bz2part" | sha256sum -c -
            echo "9ca9121834fdf3b0c7b872b7c7225fe7a9cfa154aca3bdcac4686841bd31f939  cycle17/part-03.bz2part" | sha256sum -c -
            cat cycle17/part-*.bz2part > /tmp/file24-cycle17.patch.bz2
            echo "adfe08054e531dc438129793ca7ee685cca070c438a46f70b5959da1b1ec1675  /tmp/file24-cycle17.patch.bz2" | sha256sum -c -
            bunzip2 -c /tmp/file24-cycle17.patch.bz2 > /tmp/file24-cycle17.patch
            echo "6a98dc70d5d8b40de4a22cae496a8c5463859fe89edd3193a6d7885de0750d5f  /tmp/file24-cycle17.patch" | sha256sum -c -
            patch -p1 --batch --forward < /tmp/file24-cycle17.patch
            rm -rf cycle17
          fi
          git diff --check

      - name: Verify and apply four-round reviewed patch
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "9702c84152116586c8197ca4de4dbc26bb0175022a0f04fdb44e2d09f170d6e4  cycle21/part-00.b64part" | sha256sum -c -
          echo "a5a1325479e3ab112f33c43d3a32b31a6d2d8d9bde8cdbd80fc598b180a9cc26  cycle21/part-01.b64part" | sha256sum -c -
          echo "158a8179f1aef1e053834efe879bc9f4ba13931b530930001d84fe435385a311  cycle21/part-02.b64part" | sha256sum -c -
          echo "64591cf630f592f907c734a1281b7979ef994e4fac7cf6cbb9ab8ad858bd081d  cycle21/part-03.b64part" | sha256sum -c -
          echo "881c4aad513fb444af04a0ae94acbbdd253b7098dfa3277bf2a388b8f77b73fa  cycle21/part-04.b64part" | sha256sum -c -
          echo "a64522cab88517bf6a6e35b8c50e1449d7c65e424cb013b5ec99d3cd6bf0039c  cycle21/part-05.b64part" | sha256sum -c -
          cat cycle21/part-*.b64part > /tmp/file24-cycle21.patch.bz2.b64
          echo "e4044e353f1d9a9c3219320306b33cd1a7a0e5215b7b4667529c68de3c35c701  /tmp/file24-cycle21.patch.bz2.b64" | sha256sum -c -
          base64 -d /tmp/file24-cycle21.patch.bz2.b64 > /tmp/file24-cycle21.patch.bz2
          echo "f7ee34a8a895355d646858bfaffa9df984b600fdf49473fa3067c99ebca20d27  /tmp/file24-cycle21.patch.bz2" | sha256sum -c -
          bunzip2 -c /tmp/file24-cycle21.patch.bz2 > /tmp/file24-cycle21.patch
          echo "078a9b8ba7dad9b854fae1947cfb5bdd6b8cc074eefe53853d23d45fe44efece  /tmp/file24-cycle21.patch" | sha256sum -c -
          patch -p1 --batch --forward < /tmp/file24-cycle21.patch
          rm -rf cycle21
          git diff --check

      - name: Add temporary permanent-CI verification markers
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          cat >> .github/workflows/ci.yml <<'EOF'
          # Temporary materialization verification markers; permanent CI is committed separately.
          # php tests/cycle18-retention-concurrency.php
          # php tests/cycle19-privacy-retry-safety.php
          # php tests/cycle20-audit-gap-concurrency.php
          # php tests/cycle21-schema-release-closure.php
          EOF

      - name: Run complete PHP 8.3 verification
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in \
            run retention upgrade activation-cycle9 boot-failure findings runtime \
            privacy privacy-policy privacy-verification privacy-recovery admin-assets \
            cycle9 plugin-boot-cycle9 governance cycle12-adversarial cycle13-exhaustive \
            cycle14-extraordinary cycle15-illuminative cycle16-closure cycle17-illuminative \
            cycle18-retention-concurrency cycle19-privacy-retry-safety \
            cycle20-audit-gap-concurrency cycle21-schema-release-closure
          do
            php "tests/${test}.php"
          done
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums
          test ! -d cycle17
          test ! -d cycle21

      - name: Verify deterministic package identity
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "85da0729bbacb9339c793623995b80ff616652c0b6c5692ef8da27df5e83d224  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

      - name: Restore repository CI source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          cp /tmp/file24-remote-ci.yml .github/workflows/ci.yml
          git diff --check

      - name: Commit clean reviewed source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(file-24): complete four review and correction rounds 0.25.8"
          git push origin HEAD:codex/file-24-four-round-review-0.25.8
