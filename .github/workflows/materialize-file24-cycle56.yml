name: Materialize File 24 Fifteen-Round Review

on:
  push:
    branches:
      - codex/file-24-fifteen-round-review-0.27.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: file24-cycle56-materialization
  cancel-in-progress: false

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-fifteen-round-review-0.27.0
          fetch-depth: 30

      - name: Detect pending reviewed patch
        id: pending
        shell: bash
        run: |
          if [ -f handoff-cycle56/part-00.b64part ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending Cycle 56 reviewed patch remains."
          fi

      - name: Set up PHP 8.3
        if: steps.pending.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify, apply and test reviewed patch
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "dcc19b5c326957fade5d291243cbd759ded6e5229fdf18f1df74bc916f08399c  handoff-cycle56/part-00.b64part" | sha256sum -c -
          echo "1144d7779fc0c6ee41396352b3c2bf570bab427e4717b6388c8df947a20e5766  handoff-cycle56/part-01.b64part" | sha256sum -c -
          echo "8494822497035131ca57ec8a5d8b0026e39da7d561cd7a2388640045fa6cc93a  handoff-cycle56/part-020.b64part" | sha256sum -c -
          echo "d1cdbcf5d32d9c8ff9f5bed65a31acff987974cc2af12f73e13f5f61b7ebd72f  handoff-cycle56/part-021.b64part" | sha256sum -c -
          echo "8867f6e16f12ecc505cbceb9cd4a8bacb38178df37949f9d3a3bf3742cb27261  handoff-cycle56/part-03.b64part" | sha256sum -c -
          echo "09517ea19f1dc36c5838006ad0ead081de340ca02ef8e65b73e59649c9ce9683  handoff-cycle56/part-04.b64part" | sha256sum -c -
          echo "d3b4add6e0a80728b6e36de285e690f105ceb8084173ea3d611db97b03809e30  handoff-cycle56/part-05.b64part" | sha256sum -c -
          echo "c604cdc8518f590a4c6d3942dcfe28bf2e435bf979a6856a86b942bd223e6335  handoff-cycle56/part-06.b64part" | sha256sum -c -
          cat handoff-cycle56/part-*.b64part > /tmp/file24-cycle56.patch.bz2.b64
          echo "fa94761b34feb4e3fbc645921e3b7f998cf33b3f475382567c9eff4b325343e8  /tmp/file24-cycle56.patch.bz2.b64" | sha256sum -c -
          base64 -d /tmp/file24-cycle56.patch.bz2.b64 > /tmp/file24-cycle56.patch.bz2
          echo "2d38a5d85a6f3d3661171020d7d766699ebfe67995247b395ef1c00677a2ca23  /tmp/file24-cycle56.patch.bz2" | sha256sum -c -
          bunzip2 -c /tmp/file24-cycle56.patch.bz2 > /tmp/file24-cycle56.patch
          echo "c5a01299400665ee92e5e39a72e561a595ab8daf3b20d76a4fcec81ee867d72c  /tmp/file24-cycle56.patch" | sha256sum -c -
          git apply --check /tmp/file24-cycle56.patch
          git apply /tmp/file24-cycle56.patch
          chmod +x tools/build-release.sh
          rm -rf handoff-cycle56
          git diff --check

          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' test_file; do
            php "$test_file"
          done < <(find tests -maxdepth 1 -type f -name '*.php' ! -name 'bootstrap.php' -print0 | sort -z)
          sha256sum -c CHECKSUMS.sha256

          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "430ca5be64b5bc5c8ef55f0ef16877fa6696101ddbf3385a0349bc5665bda16a  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

          cp .github/workflows/ci.yml /tmp/file24-final-ci.yml
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/materialize-file24-cycle56.yml

      - name: Commit clean reviewed source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(file-24): complete fifteen review and correction rounds 0.27.0"
          git push origin HEAD:codex/file-24-fifteen-round-review-0.27.0
