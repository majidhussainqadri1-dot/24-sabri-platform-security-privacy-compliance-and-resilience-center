name: Materialize File 24 Eight-Round Review

on:
  push:
    branches:
      - codex/file-24-eight-round-review-0.25.9
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: file24-cycle29-materialization
  cancel-in-progress: false

jobs:
  materialize-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-24-eight-round-review-0.25.9
          fetch-depth: 20

      - name: Detect pending reviewed patch
        id: pending
        shell: bash
        run: |
          if [ -f handoff-cycle29/part-00.b64part ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pending Cycle 29 reviewed patch remains."
          fi

      - name: Set up PHP 8.3
        if: steps.pending.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify and apply reviewed patch
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "33b8261920816f549833f8b297f7cbbceecf24ec401e859d4e7f83f9e61066b1  handoff-cycle29/part-00.b64part" | sha256sum -c -
          echo "f0aa633feeeb08f6fdc39a9fc6c413176154ac269a951a48609f9d67423e9795  handoff-cycle29/part-01.b64part" | sha256sum -c -
          echo "e6a8a37923cda90486be9165bb587c164e0d1696721db04340c86cd843e52e70  handoff-cycle29/part-02.b64part" | sha256sum -c -
          cat handoff-cycle29/part-*.b64part > /tmp/file24-cycle29.patch.bz2.b64
          echo "91011867c86712c09adcdccab95e86b94491809bcbb9e59d8a34f9e145292572  /tmp/file24-cycle29.patch.bz2.b64" | sha256sum -c -
          base64 -d /tmp/file24-cycle29.patch.bz2.b64 > /tmp/file24-cycle29.patch.bz2
          echo "7f12077cfc418ad04a951d7237a5824900361a3997d899625d60d6b58f8dd4b5  /tmp/file24-cycle29.patch.bz2" | sha256sum -c -
          bunzip2 -c /tmp/file24-cycle29.patch.bz2 > /tmp/file24-cycle29.patch
          echo "101e5a390277b8a40e04ea4f489dfdbd984b2f5073c9fdbc9483af32f7a2964a  /tmp/file24-cycle29.patch" | sha256sum -c -
          if git apply --check /tmp/file24-cycle29.patch; then
            git apply /tmp/file24-cycle29.patch
          else
            git apply --3way /tmp/file24-cycle29.patch
          fi
          chmod +x tools/build-release.sh
          rm -rf handoff-cycle29
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/materialize-file24-cycle29.yml
          git diff --check -- plugin tests tools README.md MANIFEST.md SECURITY.md CHECKSUMS.sha256

      - name: Run complete PHP 8.3 verification
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in \
            run retention upgrade activation-cycle9 boot-failure findings runtime \
            privacy privacy-policy privacy-verification privacy-recovery admin-assets \
            cycle9 plugin-boot-cycle9 governance cycle12-adversarial cycle13-exhaustive \
            cycle14-extraordinary cycle15-illuminative cycle16-closure cycle17-illuminative \
            cycle18-retention-concurrency cycle19-privacy-retry-safety \
            cycle20-audit-gap-concurrency cycle21-schema-release-closure \
            cycle22-manifest-heartbeat-race cycle23-governance-request-lock \
            cycle24-upgrade-lock-atomic cycle25-retention-ownership \
            cycle26-audit-gap-lock-lease cycle27-security-state-atomic \
            cycle28-control-upsert-lock cycle29-privacy-verification-compensation \
            cycle29-eight-round-release-closure
          do
            php "tests/${test}.php"
          done
          grep -v './.github/workflows/ci.yml$' CHECKSUMS.sha256 > /tmp/file24-checksums
          sha256sum -c /tmp/file24-checksums
          test ! -d handoff-cycle29

      - name: Verify deterministic package
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ONE="$(./tools/build-release.sh)"
          cp "$PACKAGE_ONE" /tmp/file24-package-one.zip
          PACKAGE_TWO="$(./tools/build-release.sh)"
          cmp /tmp/file24-package-one.zip "$PACKAGE_TWO"
          echo "74532fdf6b135f5aed29072c9463757a2ffd9f752fc054ec51366e8ed8479a9a  $PACKAGE_TWO" | sha256sum -c -
          unzip -t "$PACKAGE_TWO"

      - name: Commit clean reviewed source
        if: steps.pending.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- plugin tests tools README.md MANIFEST.md SECURITY.md CHECKSUMS.sha256
          git commit -m "fix(file-24): complete eight review and correction rounds 0.25.9"
          git push origin HEAD:codex/file-24-eight-round-review-0.25.9
